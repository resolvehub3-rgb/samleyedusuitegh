    <!-- SEO Meta Tags -->
    <meta name="description" content="SamleyEduSuite helps Ghanaian private schools manage students, teachers, parents, attendance, academic performance, terminal reports, announcements and payments in one connected platform." />
    <meta property="og:title" content="SamleyEduSuite | School Management System for Ghanaian Private Schools" />
    <meta property="og:description" content="SamleyEduSuite helps Ghanaian private schools manage students, teachers, parents, attendance, academic performance, terminal reports, announcements and payments in one connected platform." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />

    <style>
      /* Prevent FOUC */
      body { opacity: 0; transition: opacity 0.15s; }
      body.loaded { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Show body once loaded
      window.addEventListener('load', () => document.body.classList.add('loaded'));
      // Fallback in case load event already fired
      if (document.readyState === 'complete') document.body.classList.add('loaded');

      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.warn('SW registration failed:', err));
        });
      }
    </script>
  </body>
